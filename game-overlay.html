<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Info Game Overlay</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700&display=swap">
<style>
/* Game Overlay：玩遊戲時用。畫布（預設 1920×1080）上每個框都可以自由擺放：
   標題列｜徽章欄（所有進行中與即將開始的徽章，分類改用標題旁的小標籤）｜聊天室｜遊戲畫面（16:9，中間是透明的）｜資訊 Widget。
   設定存在 data/campaigns.manual.json 的 "_overlay"."game"（由 Badge Info 控制台的「Game Overlay」分頁編輯），跟原本的 overlay-v2.html 互不影響。 */
:root{
  color-scheme:dark;
  --bg:#0b0f15; --panel:#121822; --text:#f2ead8; --accent:#ffb547; --line:#2d394b; --frame:#ffb547; --rec:#ff3b3b; --cmd:#ffffff;
  --tile:color-mix(in srgb,var(--panel) 80%,#fff 6%); --tile-hi:color-mix(in srgb,var(--panel) 70%,#fff 12%); --seam:color-mix(in srgb,var(--bg) 80%,#000);
  --muted:color-mix(in srgb,var(--text) 55%,var(--panel)); --dim:color-mix(in srgb,var(--text) 35%,var(--panel));
  --fs:1; --fw:2px; --fr:14px;
  --f:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
body{color:var(--text);font-family:var(--f);font-weight:700;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden}
.box{position:absolute}

/* 遊戲畫面：中間透明，外面用陰影塗滿背景色（圓角也會跟著挖空） */
.game{z-index:0;border:var(--fw) solid var(--frame);border-radius:var(--fr);box-shadow:0 0 0 4000px var(--bg)}
html.transparent .game{box-shadow:none}
.game .gl{position:absolute;inset:0;display:none;place-items:center;color:color-mix(in srgb,var(--text) 40%,transparent);font-size:34px;letter-spacing:.2em;border-radius:inherit;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 24px,transparent 24px 48px)}
html.pv-edit .game .gl{display:grid}

/* 標題列：內容固定以 104px 高排版，再依框的高度等比縮放 */
.head{z-index:2;overflow:hidden}
.head-in{position:absolute;left:0;top:0;height:104px;transform-origin:0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;gap:24px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 28px 0 18px}
.head-in.narrow{grid-template-columns:minmax(0,1.2fr) minmax(0,.7fr) minmax(0,1fr)}
.head-in.narrow .legend{display:none}
.me{display:flex;align-items:center;gap:18px;min-width:0}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;background:var(--tile);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--rec)}
.me .name{font-size:38px;letter-spacing:.03em;line-height:1;white-space:nowrap}
.me .sub{display:flex;align-items:center;gap:16px;margin-top:8px;white-space:nowrap}
.me .tag{font-size:19px;letter-spacing:.2em;color:var(--accent)}
.viewers{display:inline-flex;align-items:center;gap:9px;font-size:21px;line-height:1}
.viewers i{width:13px;height:13px;border-radius:50%;background:var(--rec);animation:rec 2.4s ease-in-out infinite}
.viewers.off{color:var(--dim)} .viewers.off i{background:var(--dim);animation:none}
.me.off .avatar{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--dim)}
@keyframes rec{0%,100%{opacity:1;box-shadow:0 0 10px 1px color-mix(in srgb,var(--rec) 65%,transparent)}50%{opacity:.25;box-shadow:none}}
/* 圖例：顯示目前開啟的標籤 */
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;min-width:0;overflow:hidden;max-height:84px}
.legend .tg{font-size:17px}
.clock{display:flex;align-items:center;justify-content:flex-end;gap:16px;min-width:0}
.clock .d{text-align:right;font-size:19px;color:var(--muted);line-height:1.35;white-space:nowrap}
.clock .d b{display:block;color:var(--text);font-size:21px}
.clock .flap{font-size:38px}

/* 翻牌字卡 */
.flap{display:inline-flex;gap:4px;align-items:center}
.flap i{font-style:normal;display:inline-grid;place-items:center;min-width:.72em;padding:0 .08em;height:1.32em;border-radius:.14em;
  background:linear-gradient(180deg,var(--tile-hi) 0 49%,var(--seam) 49% 51%,var(--tile) 51%);color:var(--accent);line-height:1}
.flap i.sep{background:none;min-width:auto;padding:0 .02em;color:var(--dim)}
.flap i.u{background:none;min-width:auto;font-size:.55em;color:var(--muted);padding:0 .25em 0 .1em;align-self:end;height:auto;margin-bottom:.2em}
.flap i.flip{animation:flip .38s ease-out}
@keyframes flip{0%{transform:rotateX(-90deg);filter:brightness(1.6)}100%{transform:none}}

/* 面板（徽章欄、聊天室） */
.panel{z-index:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px 11px;border-bottom:1px solid var(--line);flex:none}
.ph b{font-size:calc(24px*var(--fs));letter-spacing:.1em;display:flex;align-items:center;gap:12px;min-width:0;white-space:nowrap;overflow:hidden}
.ph b::before{content:"";flex:none;width:6px;height:1em;border-radius:3px;background:var(--c,var(--accent))}
.ph em{font-style:normal;font-size:calc(22px*var(--fs));color:var(--accent);flex:none}
.chat{background:color-mix(in srgb,var(--panel) 55%,transparent);border-style:dashed}
.chat .ph b{--c:var(--dim)}
html.transparent .chat{background:transparent}

/* 捲動清單：內容超過高度時複製一份，無縫循環 */
.scroll{position:relative;flex:1;min-height:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 24px),transparent)}
.track{will-change:transform}
.list{padding:10px 10px 4px;display:flex;flex-direction:column;gap:6px}
/* 卡片：圖示｜標題＋標籤＋指令欄 → 倒數、條件・分類 → 備註 */
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;background:color-mix(in srgb,var(--rc,var(--tile)) 9%,transparent);box-shadow:inset 3px 0 0 var(--rc,transparent)}
.row .ic{width:calc(48px*var(--fs));height:calc(48px*var(--fs))}
.row .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .top{display:flex;align-items:center;gap:8px;min-width:0}
.row .nm{flex:0 1 auto;min-width:3em;font-size:calc(20px*var(--fs));line-height:1.25}
.row .tgs{flex:none;display:flex;gap:5px} /* 標籤優先完整顯示，標題放不下時用跑馬燈 */
.row .cmd{flex:none;margin-left:auto;max-width:40%;font-size:var(--cmd-size,20px);line-height:1.1;color:var(--cmd);letter-spacing:.02em}
.row .meta{display:flex;align-items:center;gap:10px;min-width:0}
.row .st{font-size:calc(13px*var(--fs));letter-spacing:.06em;flex:none;color:var(--muted)}
.row .flap{font-size:calc(17px*var(--fs));flex:none}
.row .cond{flex:1;font-size:calc(15px*var(--fs));color:var(--muted)}
.row .cond em{font-style:normal;color:var(--text)}
.row .note{font-size:calc(15px*var(--fs));color:var(--muted);line-height:1.35}
.tg{flex:none;font-size:calc(12px*var(--fs));line-height:1;padding:.32em .6em;border-radius:999px;white-space:nowrap;letter-spacing:.05em;
  color:var(--tc);background:color-mix(in srgb,var(--tc) 16%,transparent);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent)}
.empty{padding:20px;color:var(--muted);font-size:18px}
.ic{border-radius:8px;background:var(--tile);display:grid;place-items:center;overflow:hidden;flex:none}
.ic img{width:100%;height:100%;object-fit:contain}
.ic .fb{font-size:14px;color:var(--accent)}

/* 中英切換 */
html:not(.lang-en) .en, html.lang-en .zh{display:none!important}
.zh,.en,#cDate,#cTime{transition:opacity .35s ease}
html.lang-fade .zh, html.lang-fade .en, html.lang-fade #cDate, html.lang-fade #cTime{opacity:0}
.mq{display:block;min-width:0;overflow:hidden;white-space:nowrap}
.mq>span{display:inline-block}
.mq.run{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.mq.run>span{animation:mq var(--t,8s) ease-in-out infinite alternate}
@keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--d,0))}}
.langbox{display:flex;justify-content:center}
.lchip{position:relative;display:inline-flex;height:52px;border-radius:999px;border:1.5px solid var(--line);background:var(--tile);overflow:hidden;font-size:21px;letter-spacing:.04em}
.lchip span{position:relative;z-index:1;width:86px;display:grid;place-items:center;color:var(--dim);transition:color .35s}
.lchip i{position:absolute;top:0;bottom:0;left:0;width:86px;border-radius:999px;background:color-mix(in srgb,var(--accent) 20%,transparent);transition:left .35s ease;overflow:hidden}
.lchip i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--accent) 50%,transparent)}
html.lang-run .lchip i::after{animation:lfill var(--lsec,15s) linear forwards}
@keyframes lfill{to{width:100%}}
html.lang-en .lchip i{left:86px}
html:not(.lang-en) .lchip .c-zh, html.lang-en .lchip .c-en{color:var(--text)}
.nolangviz .langbox{visibility:hidden}

/* 資訊 Widget（內容在控制台「資訊 Widget」分頁編輯，位置在「Game Overlay」分頁另外設定） */
#wgLayer{position:absolute;inset:0;pointer-events:none;z-index:8}
.wg{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--text)}
.wg.clear{background:transparent}
.wg-in{position:absolute;inset:6%;overflow:hidden;display:flex;gap:5%;align-items:center;justify-content:center}
.wg-in.v{flex-direction:column}
.wg .imgs{display:flex;gap:6%;align-items:center;justify-content:center;flex:none;min-width:0;min-height:0}
.wg-in.v .imgs{width:100%;height:var(--img,40%)}
.wg-in.h .imgs{height:100%;width:var(--img,36%)}
.wg .imgs img{flex:1 1 0;min-width:0;min-height:0;width:100%;height:100%;object-fit:contain}
.wg .txt{flex:1;min-width:0;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;text-align:center}
.wg-in.h .txt{align-items:flex-start;text-align:left;align-self:stretch} /* 左右排版時文字區也要有固定高度，自動縮放才知道有沒有超出 */
/* 自訂文字大小（控制台 Game Overlay 分頁選「自訂文字大小」）：不自動縮放，放不下的那一行用跑馬燈 */
.wg.man .txt{font-size:16px}
.wg.man .txt>*{max-width:100%}
.wg.man .ttl{font-size:var(--tpx,28px)}
.wg.man .ttl .mq{flex:0 1 auto}
.wg.man .cd,.wg.man .endt{font-size:var(--cpx,32px)}
.wg.man .nt{font-size:var(--npx,18px);white-space:nowrap;line-height:1.3}
.wg .ttl{display:flex;align-items:center;gap:.4em;white-space:nowrap;line-height:1.2;letter-spacing:.04em}
.wg .ttl::before{content:"";flex:none;width:.22em;height:1em;border-radius:.11em;background:var(--accent)}
.wg .cd{margin-top:.28em;font-size:1.5em;white-space:nowrap}
.wg .endt{margin-top:.28em;font-size:1.3em;white-space:nowrap;color:var(--accent)}
.wg .nt{margin-top:.4em;font-size:.62em;line-height:1.4;white-space:pre-line;overflow-wrap:anywhere;width:100%;color:color-mix(in srgb,currentColor 78%,transparent)} /* 備註：會換行，跟標題、倒數一起縮放到放得進框 */

/* 控制台預覽：每個框上面蓋一層編輯框，可以拖曳移動、拉紫色圓點改大小 */
#edLayer{position:absolute;inset:0;z-index:20;display:none}
/* 自動對齊的參考線（像 PPT）：拖曳時對齊到其他框或畫布的邊緣、中線就會出現 */
#guides{position:absolute;inset:0;pointer-events:none;z-index:21}
.gd{position:absolute;background:#ff3fa4;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.gd.v{top:0;bottom:0;width:2px;margin-left:-1px}
.gd.h{left:0;right:0;height:2px;margin-top:-1px}
html.pv-edit #edLayer{display:block}
.ef{position:absolute;cursor:move;outline:1px dashed rgba(166,117,255,.55);outline-offset:-1px;border-radius:6px}
.ef:hover{outline-color:#a675ff;background:rgba(166,117,255,.06)}
.ef.sel{outline:3px solid #a675ff;outline-offset:2px;background:rgba(166,117,255,.08)}
.ef .lb{position:absolute;left:8px;top:8px;font-size:17px;line-height:1;color:#fff;background:rgba(116,52,230,.9);padding:6px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.ef:hover .lb,.ef.sel .lb,.ef.drag .lb{opacity:1}
.ef .hd{position:absolute;width:30px;height:30px;background:#a675ff;border:4px solid #fff;border-radius:50%;display:none;z-index:2}
.ef.sel .hd{display:block}
.hd.nw{left:-15px;top:-15px;cursor:nwse-resize}.hd.ne{right:-15px;top:-15px;cursor:nesw-resize}.hd.sw{left:-15px;bottom:-15px;cursor:nesw-resize}.hd.se{right:-15px;bottom:-15px;cursor:nwse-resize}
.hd.n{left:calc(50% - 15px);top:-15px;cursor:ns-resize}.hd.s{left:calc(50% - 15px);bottom:-15px;cursor:ns-resize}.hd.w{top:calc(50% - 15px);left:-15px;cursor:ew-resize}.hd.e{top:calc(50% - 15px);right:-15px;cursor:ew-resize}
</style>
</head>

      <div class="clock"><div class="d" id="cDate"></div><div class="flap" id="cTime"></div></div>
    </div>
  </header>

  <section class="box panel" data-box="badges">
    <div class="ph"><b id="tBadges"></b><em id="n1"></em></div>
    <div class="scroll" id="scroll"><div class="track"></div></div>
  </section>

  <section class="box panel chat" data-box="chat">
    <div class="ph"><b id="tChat"></b></div>
  </section>

  <div id="wgLayer"></div>
  <div id="edLayer"></div>
  <div id="guides"></div>
</div>

<script>
/* 設定優先順序：預設值 < campaigns.manual.json 的 "_overlay"."game" < 網址參數
   網址參數（選用）：?speed=30 捲動速度（每秒 px，0＝不捲動）｜&lang=zh|en|cycle｜&langSeconds=15｜&transparent=1｜&viewers=49（測試用）
   ?preview=1 給控制台的即時預覽用 */
const BUILTIN_TAGS=[
  {k:"soon",  on:true, zh:"即將開始",en:"Upcoming",color:"#79c2ff"},
  {k:"ending",on:true, zh:"即將結束",en:"Ending",  color:"#ff6f5e"},
  {k:"new",   on:true, zh:"新徽章",  en:"NEW",     color:"#ffd23f"},
  {k:"free",  on:true, zh:"免費",    en:"Free",    color:"#5ce0a8"},
  {k:"sub",   on:false,zh:"訂閱",    en:"Sub",     color:"#b79cff"},
  {k:"other", on:false,zh:"其他",    en:"Other",   color:"#9aa4b2"}];
const DEFAULTS={width:1920,height:1080,lang:"cycle",langSeconds:15,langViz:true,fontScale:1,cmdSize:20,speed:30,transparent:false,lock169:true,frameWidth:2,frameRadius:14,
  boxes:{head:{x:16,y:16,w:1888,h:104,show:true},badges:{x:16,y:136,w:440,h:520,show:true},chat:{x:16,y:672,w:440,h:392,show:true},game:{x:472,y:136,w:1432,h:806,show:true}},
  titles:{badges_zh:"徽章資訊",badges_en:"Badges",chat_zh:"聊天室",chat_en:"Chat"},
  colors:{bg:"#0b0f15",panel:"#121822",text:"#f2ead8",accent:"#ffb547",line:"#2d394b",frame:"#ffb547",rec:"#ff3b3b",cmd:"#ffffff"},
  tags:BUILTIN_TAGS, widgets:{}};
const P=new URLSearchParams(location.search), PREVIEW=P.get("preview")==="1";
const DATA_URL="data/badges.json", MANUAL_URL="data/campaigns.manual.json", DAY=864e5, SOON_WINDOW=14*DAY, ENDING_WINDOW=3*DAY, NEW_WINDOW=3*DAY; // 與 overlay-v2.html 相同
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=s=>s?Date.parse(s):null, now=()=>Date.now();
const $=id=>document.getElementById(id);
const BOX_KEYS=["game","head","badges","chat"];

/* ---------- 設定 ---------- */
let CFG=structuredClone(DEFAULTS), WDEF=[]; // WDEF：倒數 Widget 的內容（_overlay.widgets）
function mergeTags(a){if(!Array.isArray(a))return structuredClone(BUILTIN_TAGS);
  const out=a.filter(x=>x&&typeof x==="object"&&x.k).map(x=>({k:String(x.k),on:x.on!==false,zh:String(x.zh??""),en:String(x.en??""),color:String(x.color||"#888888")}));
  for(const b of BUILTIN_TAGS)if(!out.some(x=>x.k===b.k))out.push(structuredClone(b)); // 新加的內建標籤補在最後
  return out}
function mergeCfg(o){const c=structuredClone(DEFAULTS);if(!o||typeof o!=="object")return c;
  for(const k of Object.keys(DEFAULTS)){const v=o[k];if(v==null)continue;
    if(k==="colors"||k==="titles")Object.assign(c[k],v);
    else if(k==="boxes"){for(const b of BOX_KEYS)if(v[b]&&typeof v[b]==="object")Object.assign(c.boxes[b],v[b])}
    else if(k==="tags")c.tags=mergeTags(v);
    else if(k==="widgets"){if(typeof v==="object"&&!Array.isArray(v))c.widgets=structuredClone(v)}
    else c[k]=v}
  return c}
function urlOverrides(c){
  if(P.get("speed")!=null&&P.get("speed")!=="")c.speed=+P.get("speed");
  if(P.get("transparent")!=null)c.transparent=P.get("transparent")==="1";
  if(["zh","en","cycle"].includes(P.get("lang")))c.lang=P.get("lang");
  if(+P.get("langSeconds")>0)c.langSeconds=+P.get("langSeconds");
  return c}
const L2=(zh,en)=>`<span class="zh">${esc(zh)}</span><span class="en">${esc(en||zh)}</span>`;
function applyCfg(){
  const st=$("stage"), r=document.documentElement.style;
  for(const[k,v]of Object.entries(CFG.colors))r.setProperty("--"+k,v);
  r.setProperty("--fs",CFG.fontScale); r.setProperty("--cmd-size",(+CFG.cmdSize||20)+"px");
  r.setProperty("--fw",Math.max(0,+CFG.frameWidth||0)+"px"); r.setProperty("--fr",Math.max(0,+CFG.frameRadius||0)+"px");
  st.style.width=CFG.width+"px"; st.style.height=CFG.height+"px";
  st.classList.toggle("nolangviz",CFG.langViz===false);
  document.documentElement.classList.toggle("transparent",!!CFG.transparent);
  const T=CFG.titles; $("tBadges").innerHTML=L2(T.badges_zh,T.badges_en); $("tChat").innerHTML=L2(T.chat_zh,T.chat_en);
  $("legend").innerHTML=CFG.tags.filter(x=>x.on).map(tagHTML).join("");
  fit(); placeBoxes(); sig=""; if(DB) refresh(); startLang(); WG_SIG=""; renderWidgets(); edRender();
}
function fit(){const s=Math.min(innerWidth/CFG.width,innerHeight/CFG.height),st=$("stage");st.style.transform=`scale(${s})`;st.style.left=(innerWidth-CFG.width*s)/2+"px";st.style.top=(innerHeight-CFG.height*s)/2+"px"}
addEventListener("resize",()=>{fit();sig="";if(DB)refresh()});
/* 依設定擺放每個框；標題列的內容以 104px 高排版後等比縮放 */
function placeBoxes(){
  for(const k of BOX_KEYS){const b=CFG.boxes[k],el=document.querySelector(`[data-box="${k}"]`);
    el.hidden=b.show===false; Object.assign(el.style,{left:b.x+"px",top:b.y+"px",width:b.w+"px",height:b.h+"px"})}
  const h=CFG.boxes.head, s=h.h/104, iw=h.w/s, hi=$("headIn");
  hi.style.width=iw+"px"; hi.style.transform=`scale(${s})`; hi.classList.toggle("narrow",iw<1300);
}

/* ---------- 翻牌字卡 ---------- */
function flap(el,parts){
  const want=[];for(const p of parts){if(p.u)want.push(["u",p.u]);else if(p.s)want.push(["sep",p.s]);else for(const ch of p.t)want.push(["d",ch])}
  const kids=el.children;
  if(kids.length!==want.length||[...kids].some((k,i)=>k.dataset.k!==want[i][0])){
    el.innerHTML=want.map(([k,v])=>`<i class="${k==="d"?"":k}" data-k="${k}">${esc(v)}</i>`).join("");return;
  }
  want.forEach(([k,v],i)=>{const n=kids[i];if(n.textContent!==v){n.textContent=v;if(k==="d"){n.classList.remove("flip");void n.offsetWidth;n.classList.add("flip")}}});
}
const p2=n=>String(n).padStart(2,"0");
function cdParts(ms){if(ms<0)ms=0;
  const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  return d?[{t:String(d)},{u:LANG==="en"?"d":"天"},{t:p2(h)},{s:":"},{t:p2(m)},{s:":"},{t:p2(s)}]:[{t:p2(h)},{s:":"},{t:p2(m)},{s:":"},{t:p2(s)}]}

/* ---------- 時鐘（英文版用 UTC，中文版標 UTC+8 台灣時間） ---------- */
const fD=new Intl.DateTimeFormat("zh-TW",{month:"long",day:"numeric",weekday:"long"}), fE=new Intl.DateTimeFormat("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
const tzZh=(()=>{const o=-new Date().getTimezoneOffset(),h=Math.trunc(Math.abs(o)/60),m=Math.abs(o)%60;
  const s="UTC"+(o>=0?"+":"-")+h+(m?":"+p2(m):"");return Intl.DateTimeFormat().resolvedOptions().timeZone==="Asia/Taipei"?s+" 台灣時間":s})();
function clock(){const d=new Date(),en=LANG==="en";
  $("cDate").innerHTML=en?`<b>${esc(fE.format(d))}</b>UTC`:`<b>${esc(fD.format(d))}</b>${esc(tzZh)}`;
  const H=en?d.getUTCHours():d.getHours(),M=en?d.getUTCMinutes():d.getMinutes(),S=d.getSeconds();
  flap($("cTime"),[{t:p2(H)},{s:":"},{t:p2(M)},{s:":"},{t:p2(S)}])}

/* ---------- 直播狀態（與 overlay-v2.html 相同，每分鐘讀 Worker 的 /channel） ---------- */
const CHANNEL_API=P.get("api")||"https://badge-notifier.lwldoge.workers.dev/channel";
function setViewers(n){const v=$("viewers"),off=n==null||n==="off";
  v.classList.toggle("off",off); document.querySelector(".me").classList.toggle("off",off);
  $("vc").innerHTML=off?'<span class="zh">離線</span><span class="en">Offline</span>':Number(n).toLocaleString("en-US")}
async function loadChannel(){try{const r=await fetch(CHANNEL_API+"?t="+Date.now(),{cache:"no-store"}),j=await r.json();if(!j.ok)return;
  setViewers(j.live?j.viewers:null);const a=$("avatar");
  if(j.avatar&&a.dataset.src!==j.avatar){const img=new Image();img.onload=()=>{a.src=j.avatar;a.dataset.src=j.avatar};img.src=j.avatar}}catch(_){}}
if(P.get("viewers")!=null) setViewers(P.get("viewers")); else { setViewers(null); loadChannel(); setInterval(loadChannel,60*1000); }

/* ---------- 徽章 ---------- */
function autoType(b){const c=b.campaign||{},d=b.description||""; // 與 overlay-v2.html、控制台相同
  if(c.subs)return "sub"; if(c.minutes)return "free";
  if(/subscrib|gift|subbed/i.test(d))return "sub"; if(/purchas|ticket/i.test(d))return "other"; return "free"}
let MANUAL={};
const keyOf=b=>b.set_id+"/"+b.id;
const typeOf=b=>MANUAL[keyOf(b)]?.type||autoType(b);
const columnOf=b=>MANUAL[keyOf(b)]?.column||"";
const cond=b=>{const m=MANUAL[keyOf(b)],c=m||b.campaign||{},g=c.game?`<span class="g">${esc(c.game)}</span>`:"",r=c.subs?`<span class="zh">訂閱 <em>${c.subs}</em> 次</span><span class="en">Sub ×<em>${c.subs}</em></span>`:c.minutes?`<span class="zh">觀看 <em>${c.minutes}</em> 分鐘</span><span class="en">Watch <em>${c.minutes}</em> min</span>`:"";return r&&g?`${r}<span class="g">　・　</span>${g}`:r||g};
const initials=s=>String(s).replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const icon=b=>`<span class="ic"><img src="${esc(b.image_url_2x||b.image_url_4x||"")}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${initials(b.title)}'}))"></span>`;
const mq=(cls,html)=>`<span class="mq ${cls}"><span>${html}</span></span>`;
const isNew=(b,n)=>{const s=t(b.campaign?.start),e=t(b.campaign?.end);return !!s&&n>=s&&n-s<NEW_WINDOW&&(!e||n<e)};
function kindOf(b,n){const c=b.campaign||{},s=t(c.start),e=t(c.end);
  if(!s)return "tbd"; if(n<s)return "soon"; if(e&&n>=e)return "ended"; return e&&e-n<ENDING_WINDOW?"last":"live"}
const tagHTML=x=>`<span class="tg" style="--tc:${esc(x.color)}">${L2(x.zh,x.en)}</span>`;
const tagColor=k=>CFG.tags.find(x=>x.k===k)?.color;
/* 這個徽章有哪些標籤（照控制台排的順序，只顯示整體有開啟的）。
   徽章的 tags："soon,free,c_xxx"（逗號分隔）。tags_manual＝true：內建標籤也照 tags 手動指定；沒有＝內建標籤自動判斷，tags 只管自訂標籤 */
function tagsOf(b,k,n){const m=MANUAL[keyOf(b)]||{},ty=typeOf(b),mine=String(m.tags||"").split(",").filter(Boolean);
  const has={soon:k==="soon",ending:k==="last",new:isNew(b,n),free:ty==="free",sub:ty==="sub",other:ty==="other"};
  return CFG.tags.filter(x=>x.on&&(m.tags_manual||!(x.k in has)?mine.includes(x.k):has[x.k]))}
const ST_ZH={live:"剩餘",last:"剩餘",soon:"距離開始",tbd:"時間未公布"}, ST_EN={live:"Ends in",last:"Ends in",soon:"Starts in",tbd:"TBA"};
function rowHTML(b,k,n){
  const c=b.campaign||{}, m=MANUAL[keyOf(b)]||{}, target=k==="soon"?c.start:c.end;
  const cd=k==="tbd"||!target?"":`<span class="flap" data-t="${esc(target)}"></span>`;
  const line=v=>String(v??"").replace(/\s*\n\s*/g,"　").trim();
  const note=line(m.note??c.note), note2=line(m.note_extra??c.note_extra), cd2=cond(b);
  const tg=tagsOf(b,k,n);
  // 卡片左邊的色條：即將結束 > 新徽章 > 即將開始
  const rc=k==="last"?tagColor("ending"):isNew(b,n)?tagColor("new"):k==="soon"?tagColor("soon"):"";
  return `<div class="row"${rc?` style="--rc:${esc(rc)}"`:""}>${icon(b)}<div class="bd">
    <div class="top">${mq("nm",esc(b.title))}${tg.length?`<span class="tgs">${tg.map(tagHTML).join("")}</span>`:""}${m.cmd?mq("cmd",esc(m.cmd)):""}</div>
    <div class="meta"><span class="st">${L2(ST_ZH[k],ST_EN[k])}</span>${cd}${cd2?mq("cond",cd2):""}</div>
    ${note&&note2?mq("note",`<span class="zh">${esc(note)}</span><span class="en">${esc(note2)}</span>`):(note||note2)?mq("note",esc(note||note2)):""}</div></div>`;
}
function marquee(root){root.querySelectorAll(".mq").forEach(el=>{const over=el.firstElementChild.scrollWidth-el.clientWidth;
  if(over>2){const d=-(over+20)+"px",tt=Math.max(4,(over+20)/45/0.76).toFixed(1)+"s";
    if(el.style.getPropertyValue("--d")!==d)el.style.setProperty("--d",d);if(el.style.getPropertyValue("--t")!==tt)el.style.setProperty("--t",tt);el.classList.add("run")}
  else el.classList.remove("run")})}
setInterval(()=>marquee($("stage")),5000);

/* ---------- 資料 ---------- */
let DB=null, sig="";
async function load(){
  try{const q="?t="+Date.now(),[a,m]=await Promise.all([fetch(DATA_URL+q,{cache:"no-store"}),fetch(MANUAL_URL+q,{cache:"no-store"}).catch(()=>null)]);
    if(a.ok)DB=await a.json(); if(m&&m.ok)MANUAL=await m.json()}catch(_){}
  if(!PREVIEW){const o=MANUAL._overlay||{};CFG=urlOverrides(mergeCfg(o.game));WDEF=Array.isArray(o.widgets)?o.widgets:[]}
  applyCfg();
}
/* 所有還拿得到的徽章：進行中＋14 天內開始；控制台手動指定位置的也算（沒有時間也顯示）；已結束、設成「不顯示」的不放 */
function refresh(){
  const n=now(), L=[];
  for(const b of DB?.badges||[]){
    if(b.removed_at)continue;
    const k=kindOf(b,n), col=columnOf(b);
    if(k==="ended"||col==="hide")continue;
    if(col){L.push([b,k]);continue}
    if(k==="tbd")continue;
    if(k==="soon"&&t(b.campaign.start)-n>=SOON_WINDOW)continue;
    if(k!=="soon"&&typeOf(b)==="other"&&!CFG.tags.some(x=>x.k==="other"&&x.on))continue; // 類型「其他」：開了「其他」標籤才顯示
    L.push([b,k])}
  const ORDER={last:0,live:1,soon:2,tbd:3};
  const at=([b,k])=>k==="soon"?t(b.campaign.start):(t(b.campaign?.end)??Infinity);
  L.sort((x,y)=>ORDER[x[1]]-ORDER[y[1]]||at(x)-at(y)||x[0].title.localeCompare(y[0].title));
  const s=JSON.stringify([CFG.tags,L.map(([b,k])=>{const c=b.campaign||{},m=MANUAL[keyOf(b)]||{};return [keyOf(b),c.start,c.end,m,k,isNew(b,n),typeOf(b)]})]);
  if(s===sig)return; sig=s;
  $("n1").textContent=L.length||"";
  fill(L.map(([b,k])=>rowHTML(b,k,n)),L2("目前沒有進行中或即將開始的徽章","No badges available right now"));
  tick(); marquee($("stage"));
}
let SC=null;
function fill(rows,emptyText){
  const box=$("scroll"), tr=box.querySelector(".track");
  const one=rows.length?`<div class="list">${rows.join("")}</div>`:`<div class="empty">${emptyText}</div>`;
  tr.innerHTML=one;
  const h=tr.firstElementChild.offsetHeight, loop=rows.length&&h>box.clientHeight&&CFG.speed>0;
  if(loop) tr.innerHTML=one+one;
  SC={tr,h,loop,y:loop&&SC?SC.y%h:0};
  if(!loop) tr.style.transform="";
}
let lastTs=0;
function frame(ts){const dt=lastTs?Math.min(0.1,(ts-lastTs)/1000):0;lastTs=ts;
  if(SC&&SC.loop){SC.y=(SC.y+(+CFG.speed||0)*dt)%SC.h;SC.tr.style.transform=`translateY(${-SC.y}px)`}
  requestAnimationFrame(frame)}
function tick(){const n=now();document.querySelectorAll(".row .flap[data-t]").forEach(el=>{const x=t(el.dataset.t);if(x)flap(el,cdParts(x-n))})}

/* ---------- 資訊 Widget：內容沿用「資訊 Widget」分頁，Game Overlay 自己的設定在 game.widgets[id]：
   {show,x,y,w,h, img（圖片大小 %，沒有＝預設：左右排 36%、上下排 40%）, fit（"manual"＝自訂文字大小）, tpx／cpx／npx（標題／倒數／備註字級 px）} ---------- */
const wgLayer=$("wgLayer");
let WG_SIG="";
const wgList=()=>WDEF.filter(w=>w&&w.id&&CFG.widgets[w.id]?.show).map(w=>({...w,...CFG.widgets[w.id]}));
/* 資訊 Widget：每個部分都可選（標題 2、倒數、備註 1、備註 2、圖片），可以連結一個徽章（badge＝set_id/版本）。
   欄位：show_cd（預設顯示）、to_mode（time＝倒數到 to｜badge＝跟隨連結徽章：開始前倒數到開始，開始後倒數到結束）、
   show_n1／show_n2（備註 1＝中文、備註 2＝英文；兩個都有時跟著中英切換）、note1／note2（留空＝用連結徽章的 note／note_extra）、show_img（預設顯示） */
const wgBadge=w=>w.badge&&DB?(DB.badges||[]).find(b=>keyOf(b)===w.badge)||null:null;
function wgNotes(w){const b=wgBadge(w),m=(w.badge&&MANUAL[w.badge])||{},c=b?.campaign||{},L=v=>String(v??"").trim();
  return [w.show_n1?L(w.note1)||L(m.note??c.note):"", w.show_n2?L(w.note2)||L(m.note_extra??c.note_extra):""]}
function wgNoteHTML(w,man){const[a,b]=wgNotes(w);if(!a&&!b)return"";const x=a&&b?`<span class="zh">${esc(a)}</span><span class="en">${esc(b)}</span>`:esc(a||b);
  return man?`<div class="nt mq"><span>${x}</span></div>`:`<div class="nt">${x}</div>`}
function wgTarget(w,n){if(w.show_cd===false)return null;
  if(w.to_mode==="badge"){const b=wgBadge(w);if(!b)return null;const m=MANUAL[w.badge]||{},c=b.campaign||{},s=t(m.start??c.start),e=t(m.end??c.end);return s&&n<s?s:(e||null)}
  return Date.parse(w.to)||null}
function wgLayout(w){if(w.show_img===false||!(w.images||[]).length)return"none";if(w.layout==="v"||w.layout==="h")return w.layout;return w.w/w.h>=2.2?"h":"v"}
function wgHTML(w){
  const L=wgLayout(w), c=w.colors||{}, man=w.fit==="manual", px=v=>Math.max(6,Math.min(300,+v||0));
  const st=`left:${+w.x||0}px;top:${+w.y||0}px;width:${+w.w||300}px;height:${+w.h||160}px;`+(c.bg?`--panel:${c.bg};`:"")+(c.fg?`--text:${c.fg};`:"")+(c.num?`--accent:${c.num};`:"")
    +(+w.img>0?`--img:${Math.max(5,Math.min(90,+w.img))}%;`:"")+(man?(w.tpx?`--tpx:${px(w.tpx)}px;`:"")+(w.cpx?`--cpx:${px(w.cpx)}px;`:"")+(w.npx?`--npx:${px(w.npx)}px;`:""):"");
  const imgs=L==="none"?"":`<div class="imgs">${w.images.map(u=>`<img src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">`).join("")}</div>`;
  const ttl=`<span class="zh">${esc(w.title||"")}</span><span class="en">${esc(w.title2||w.title||"")}</span>`;
  return `<div class="wg ${w.clear?"clear":""} ${man?"man":""}" data-id="${esc(w.id)}" style="${esc(st)}">
    <div class="wg-in ${L==="h"?"h":"v"}">${imgs}<div class="txt"><div class="ttl">${man?`<span class="mq"><span>${ttl}</span></span>`:ttl}</div>
    <div class="cd flap"></div>${man?`<div class="endt mq" hidden><span>${esc(w.end_text||"")}</span></div>`:`<div class="endt" hidden>${esc(w.end_text||"")}</div>`}${wgNoteHTML(w,man)}</div></div></div>`;
}
function renderWidgets(){const list=wgList(),s=JSON.stringify([list,list.map(wgNotes),list.map(w=>!!wgBadge(w))]);if(s===WG_SIG)return;WG_SIG=s;wgLayer.innerHTML=list.map(wgHTML).join("");wgTick(true)}
function wgTick(force){const n=now(),list=wgList();
  wgLayer.querySelectorAll(".wg").forEach(el=>{const w=list.find(x=>x.id===el.dataset.id);if(!w)return;
    const T=wgTarget(w,n), ms=T==null?null:T-n, txt=ms!=null&&ms<=0&&w.end_mode==="text"&&(w.end_text||"").trim();
    const cd=el.querySelector(".cd"), et=el.querySelector(".endt"); cd.hidden=ms==null||!!txt; et.hidden=!txt;
    if(ms!=null&&!txt)flap(cd,cdParts(ms));
    const k=txt?"t":ms==null?"n":String(cd.children.length); if(force||el.dataset.k!==k){el.dataset.k=k;wgFit(el)}})}
function wgFit(el){const box=el.querySelector(".txt");if(!box)return;
  if(el.classList.contains("man")){marquee(el);return} // 自訂文字大小：不縮放，超出的那一行跑馬燈
  let lo=4,hi=400;
  for(let i=0;i<14;i++){const mid=(lo+hi)/2;box.style.fontSize=mid+"px";if(box.scrollWidth<=box.clientWidth+.5&&box.scrollHeight<=box.clientHeight+.5)lo=mid;else hi=mid}
  box.style.fontSize=lo+"px"}
const wgFitAll=()=>wgLayer.querySelectorAll(".wg").forEach(wgFit);

/* ---------- 控制台預覽：拖曳移動、拉紫色圓點改大小；遊戲畫面可鎖定 16:9 ---------- */
const ED=$("edLayer"), NAMES={game:"遊戲畫面",head:"標題列",badges:"徽章欄",chat:"聊天室"};
let SEL=null;
const rectOf=k=>k.startsWith("wg:")?CFG.widgets[k.slice(3)]:CFG.boxes[k];
function edKeys(){return ["game","head","badges","chat"].filter(k=>CFG.boxes[k].show!==false).concat(wgList().map(w=>"wg:"+w.id))}
function edName(k){if(k.startsWith("wg:")){const w=WDEF.find(x=>x.id===k.slice(3));return "Widget："+(w?.title||"未命名")}return NAMES[k]+(k==="game"&&CFG.lock169?" 16:9":"")}
let DRAG=false;
function edRender(){if(!PREVIEW||DRAG)return;
  ED.innerHTML=edKeys().map(k=>{const r=rectOf(k);return `<div class="ef ${k===SEL?"sel":""}" data-k="${esc(k)}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px"><span class="lb">${esc(edName(k))}　${r.w}×${r.h}</span>${["nw","n","ne","e","se","s","sw","w"].map(h=>`<span class="hd ${h}" data-h="${h}"></span>`).join("")}</div>`}).join("")}
const MIN={head:[300,40],badges:[160,120],chat:[120,70],game:[320,180]};
/* 自動對齊（像 PPT）：拖曳或改大小時，邊緣與中線靠近其他框、畫布邊緣或畫布中線 10px 內就吸過去，並畫出參考線。按住 Alt 可以暫時不吸附 */
const SNAP=10, GD=$("guides");
function snapLines(k){const xs=[0,CFG.width/2,CFG.width],ys=[0,CFG.height/2,CFG.height];
  for(const q of edKeys()){if(q===k)continue;const o=rectOf(q);if(!o)continue;xs.push(o.x,o.x+o.w/2,o.x+o.w);ys.push(o.y,o.y+o.h/2,o.y+o.h)}
  return {xs,ys}}
function nearest(ps,lines){let best=null;for(const p of ps)for(const L of lines){const d=L-p;if(Math.abs(d)<=SNAP&&(!best||Math.abs(d)<Math.abs(best.d)))best={d,L}}return best}
function guides(gx,gy){GD.innerHTML=(gx!=null?`<i class="gd v" style="left:${gx}px"></i>`:"")+(gy!=null?`<i class="gd h" style="top:${gy}px"></i>`:"")}
if(PREVIEW){
  document.documentElement.classList.add("pv-edit");
  ED.addEventListener("pointerdown",e=>{
    const el=e.target.closest(".ef"); if(!el) return; e.preventDefault();
    const k=el.dataset.k, R=rectOf(k); if(!R) return;
    if(SEL!==k){SEL=k;ED.querySelectorAll(".ef").forEach(n=>n.classList.toggle("sel",n===el));parent.postMessage({type:"game-box-pick",key:k},"*")}
    const h=e.target.dataset.h||"move", sx=e.clientX, sy=e.clientY, o={x:+R.x,y:+R.y,w:+R.w,h:+R.h};
    const sc=$("stage").getBoundingClientRect().width/CFG.width, W0=CFG.width, H0=CFG.height, lock=k==="game"&&CFG.lock169, [mw,mh]=MIN[k]||[120,70];
    el.setPointerCapture(e.pointerId); el.classList.add("drag"); DRAG=true; const lb=el.querySelector(".lb");
    const move=ev=>{const dx=(ev.clientX-sx)/sc, dy=(ev.clientY-sy)/sc, r={...o};
      if(h==="move"){r.x=o.x+dx;r.y=o.y+dy}
      else{
        if(h.includes("e"))r.w=o.w+dx; if(h.includes("w"))r.w=o.w-dx; if(h.includes("s"))r.h=o.h+dy; if(h.includes("n"))r.h=o.h-dy;
        r.w=Math.max(mw,Math.min(W0,r.w)); r.h=Math.max(mh,Math.min(H0,r.h));
        if(lock){ // 16:9：拉左右或角落時以寬為準，只拉上下時以高為準
          if(h==="n"||h==="s")r.w=r.h*16/9; else r.h=r.w*9/16;
          if(r.h>H0){r.h=H0;r.w=r.h*16/9} if(r.w>W0){r.w=W0;r.h=r.w*9/16}}
        if(h.includes("w"))r.x=o.x+o.w-r.w; if(h.includes("n"))r.y=o.y+o.h-r.h;
        if(lock&&(h==="n"||h==="s"))r.x=o.x+(o.w-r.w)/2; if(lock&&(h==="e"||h==="w"))r.y=o.y+(o.h-r.h)/2}
      let gx=null,gy=null;
      if(!ev.altKey){const S=snapLines(k);
        if(h==="move"){
          const bx=nearest([r.x,r.x+r.w/2,r.x+r.w],S.xs); if(bx){r.x+=bx.d;gx=bx.L}
          const by=nearest([r.y,r.y+r.h/2,r.y+r.h],S.ys); if(by){r.y+=by.d;gy=by.L}
        }else if(!lock){ // 改大小時只吸附正在拉的那一邊（遊戲畫面鎖 16:9 時不吸附，避免比例跑掉）
          if(h.includes("e")){const b=nearest([r.x+r.w],S.xs);if(b&&r.w+b.d>=mw){r.w+=b.d;gx=b.L}}
          if(h.includes("w")){const b=nearest([r.x],S.xs);if(b&&r.w-b.d>=mw){r.x+=b.d;r.w-=b.d;gx=b.L}}
          if(h.includes("s")){const b=nearest([r.y+r.h],S.ys);if(b&&r.h+b.d>=mh){r.h+=b.d;gy=b.L}}
          if(h.includes("n")){const b=nearest([r.y],S.ys);if(b&&r.h-b.d>=mh){r.y+=b.d;r.h-=b.d;gy=b.L}}
        }}
      guides(gx,gy);
      r.x=Math.max(0,Math.min(W0-r.w,r.x)); r.y=Math.max(0,Math.min(H0-r.h,r.y));
      Object.assign(R,{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.w),h:Math.round(r.h)});
      Object.assign(el.style,{left:R.x+"px",top:R.y+"px",width:R.w+"px",height:R.h+"px"}); lb.textContent=`${edName(k)}　${R.w}×${R.h}`;
      if(k.startsWith("wg:")){const w=wgLayer.querySelector(`.wg[data-id="${CSS.escape(k.slice(3))}"]`);if(w){Object.assign(w.style,{left:R.x+"px",top:R.y+"px",width:R.w+"px",height:R.h+"px"});if(h!=="move")wgFit(w)}}
      else placeBoxes()};
    const up=()=>{DRAG=false;guides(null,null);el.classList.remove("drag");el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);
      WG_SIG="";renderWidgets();sig="";if(DB)refresh();
      parent.postMessage({type:"game-box-move",key:k,x:R.x,y:R.y,w:R.w,h:R.h},"*")};
    el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  });
  addEventListener("message",e=>{const d=e.data;if(!d||typeof d!=="object")return;
    if(d.type==="game-config"){CFG=mergeCfg(d.config);if(d.lang)CFG.lang=d.lang;WDEF=Array.isArray(d.widgets)?d.widgets:[];applyCfg()}
    if(d.type==="overlay-manual"){MANUAL=d.manual||{};sig="";if(DB)refresh();renderWidgets()}
    if(d.type==="game-box-select"&&(d.key||null)!==SEL){SEL=d.key||null;edRender()}}); // 拖曳中收到自己選的框時不重畫，避免中斷拖曳
}

/* ---------- 中英切換 ---------- */
var LANG="zh", langTimer=null, langKey="";
function setLang(l,fade){
  if(l===LANG&&!fade)return;
  const apply=()=>{LANG=l;document.documentElement.classList.toggle("lang-en",l==="en");document.documentElement.lang=l==="en"?"en":"zh-Hant";
    clock();tick();marquee($("stage"));wgFitAll();document.documentElement.classList.remove("lang-fade");langFill()};
  if(fade){document.documentElement.classList.add("lang-fade");setTimeout(apply,350)}else apply();
}
function langFill(){const h=document.documentElement;h.style.setProperty("--lsec",Math.max(3,+CFG.langSeconds||15)+"s");h.classList.remove("lang-run");void h.offsetWidth;if(CFG.lang==="cycle")h.classList.add("lang-run")}
function startLang(){const k=CFG.lang+"/"+CFG.langSeconds;if(k===langKey)return;langKey=k;clearInterval(langTimer);langTimer=null;
  if(CFG.lang==="cycle"){langTimer=setInterval(()=>setLang(LANG==="en"?"zh":"en",true),Math.max(3,+CFG.langSeconds||15)*1000);langFill()}
  else{setLang(CFG.lang==="en"?"en":"zh",false);langFill()}}

clock(); applyCfg(); load();
setInterval(()=>{clock();tick();wgTick(false)},1000);
setInterval(()=>{if(DB)refresh()},15*1000);
if(!PREVIEW) setInterval(load,60*1000);
document.fonts?.ready.then(()=>{sig="";if(DB)refresh();wgFitAll()});
requestAnimationFrame(frame);
if(PREVIEW) parent.postMessage({type:"overlay-ready"},"*");
</script>
</body>
