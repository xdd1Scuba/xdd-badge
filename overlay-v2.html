<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badge Info Overlay</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700&display=swap">
<style>
/* Layout：畫布尺寸由設定決定（預設 1920×1080），等比縮放。
   上方標頭（頭貼＋X_D_D__／Badge Info＋直播紅點與觀眾數｜圖例｜時鐘）
   下方三欄：左＝即將開始・即將結束＋聊天室（上下各半）｜中＝訂閱／贈訂徽章｜右＝免費徽章。各欄獨立上下滾動。
   顏色、尺寸、速度都來自 data/campaigns.manual.json 的 "_overlay"（由 Badge Info 控制台編輯）。 */
:root{
  color-scheme:dark;
  --bg:#0b0f15; --panel:#121822; --text:#f2ead8; --accent:#ffb547;
  --sub:#b79cff; --free:#5ce0a8; --soon:#79c2ff; --last:#ff6f5e; --rec:#ff3b3b;
  --tile:color-mix(in srgb,var(--panel) 80%,#fff 6%); --tile-hi:color-mix(in srgb,var(--panel) 70%,#fff 12%); --seam:color-mix(in srgb,var(--bg) 80%,#000);
  --line:color-mix(in srgb,var(--panel) 75%,#7f9cc8 25%);
  --muted:color-mix(in srgb,var(--text) 55%,var(--panel)); --dim:color-mix(in srgb,var(--text) 35%,var(--panel));
  --fs:1;
  --f:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
html.transparent,html.transparent body{background:transparent}
body{color:var(--text);font-family:var(--f);font-weight:700;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;padding:26px 30px 30px;display:grid;grid-template-rows:104px 1fr;gap:22px;
  background:radial-gradient(1200px 700px at 40% 0%,color-mix(in srgb,var(--bg) 85%,#3a5a8a 15%) 0%,transparent 70%)}
html.transparent #stage{background:none}

/* 標頭 */
.head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 28px 0 18px}
.me{display:flex;align-items:center;gap:18px}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;background:var(--tile);box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--rec)}
.me .name{font-size:38px;letter-spacing:.03em;line-height:1}
.me .sub{display:flex;align-items:center;gap:16px;margin-top:8px}
.me .tag{font-size:19px;letter-spacing:.2em;color:var(--accent)}
.viewers{display:inline-flex;align-items:center;gap:9px;font-size:21px;line-height:1}
.viewers i{width:13px;height:13px;border-radius:50%;background:var(--rec);animation:rec 2.4s ease-in-out infinite}
.viewers.off{color:var(--dim)} .viewers.off i{background:var(--dim);animation:none}
.me.off .avatar{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--dim)} /* 沒開台時頭貼外框改成灰色 */
@keyframes rec{0%,100%{opacity:1;box-shadow:0 0 10px 1px color-mix(in srgb,var(--rec) 65%,transparent)}50%{opacity:.25;box-shadow:none}}
.legend{display:flex;justify-content:center;gap:26px;font-size:19px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:1px}
.clock{display:flex;align-items:center;gap:20px}
.clock .d{text-align:right;font-size:19px;color:var(--muted);line-height:1.35}
.clock .d b{display:block;color:var(--text);font-size:21px}
.clock .flap{font-size:40px}

/* 翻牌字卡 */
.flap{display:inline-flex;gap:4px;align-items:center}
.flap i{font-style:normal;display:inline-grid;place-items:center;min-width:.72em;padding:0 .08em;height:1.32em;border-radius:.14em;
  background:linear-gradient(180deg,var(--tile-hi) 0 49%,var(--seam) 49% 51%,var(--tile) 51%);color:var(--accent);line-height:1}
.flap i.sep{background:none;min-width:auto;padding:0 .02em;color:var(--dim)}
.flap i.u{background:none;min-width:auto;font-size:.55em;color:var(--muted);padding:0 .25em 0 .1em;align-self:end;height:auto;margin-bottom:.2em}
.flap i.flip{animation:flip .38s ease-out}
@keyframes flip{0%{transform:rotateX(-90deg);filter:brightness(1.6)}100%{transform:none}}

/* 三欄 */
.cols{position:relative;display:grid;grid-template-columns:var(--cols,26fr 37fr 37fr);gap:24px;min-height:0}
.cols>*{min-width:0}
/* 欄寬拖曳條（只在控制台預覽出現）：放在欄與欄的間隙中，中間有三個點 */
.split{position:absolute;top:0;bottom:0;width:24px;margin-left:-12px;cursor:col-resize;z-index:5;display:grid;place-items:center;touch-action:none}
.split::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;border-radius:1px;background:var(--accent);opacity:0;transition:opacity .15s}
.split i{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px 6px;border-radius:999px;background:var(--tile-hi);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.split i b{width:6px;height:6px;border-radius:50%;background:var(--text)}
.split:hover::before,.split.drag::before{opacity:.6}
.split:hover i,.split.drag i{background:var(--accent)} .split:hover i b,.split.drag i b{background:var(--bg)}
.stack{display:grid;grid-template-rows:1fr 1fr;gap:24px;min-height:0}
#stage.chat-none .stack{grid-template-rows:1fr}
#stage.chat-top #chatPanel{order:-1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px 12px;border-bottom:1px solid var(--line)}
.ph b{font-size:calc(24px*var(--fs));letter-spacing:.1em;display:flex;align-items:center;gap:12px}
.ph b::before{content:"";width:6px;height:1em;border-radius:3px;background:var(--c,var(--accent))}
.ph span{font-size:16px;letter-spacing:.24em;color:var(--dim)}
.ph em{font-style:normal;font-size:calc(22px*var(--fs));color:var(--c,var(--accent))}

/* 捲動清單：內容超過高度時複製一份，無縫循環 */
.scroll{position:relative;flex:1;min-height:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 18px,#000 calc(100% - 28px),transparent)}
.track{will-change:transform}
.list{padding:10px 12px 4px;display:flex;flex-direction:column;gap:6px}
/* 卡片：圖示｜內容（標題列〔標題＋指令欄〕→ 狀態列〔狀態、倒數、條件・分類〕→ 備註） */
.row{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--tile) 45%,transparent)}
.row .ic{width:calc(52px*var(--fs));height:calc(52px*var(--fs))}
.row .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .top{display:flex;align-items:center;gap:12px;min-width:0}
.row .nm{flex:1;font-size:calc(22px*var(--fs));line-height:1.25}
.row .cmd{flex:none;max-width:45%;font-size:var(--cmd-size,28px);line-height:1.1;color:var(--cmd);letter-spacing:.02em}
.row .meta{display:flex;align-items:center;gap:12px;min-width:0}
.row .note{font-size:calc(16px*var(--fs));color:var(--muted);line-height:1.35}
/* 跑馬燈：放得下就不動；放不下時先停一下，慢慢捲到最後，再捲回來 */
.mq{display:block;min-width:0;overflow:hidden;white-space:nowrap}
.mq>span{display:inline-block}
.mq.run{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.mq.run>span{animation:mq var(--t,8s) ease-in-out infinite alternate}
@keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--d,0))}}
.row .st{font-size:calc(14px*var(--fs));letter-spacing:.08em;flex:none}
.row .flap{font-size:calc(18px*var(--fs));flex:none}
.row .cond{flex:1;font-size:calc(16px*var(--fs));color:var(--muted)}
.row .cond em{font-style:normal;color:var(--text)}
.row.last{background:color-mix(in srgb,var(--last) 9%,transparent);box-shadow:inset 3px 0 0 var(--last)}
.row.soon{background:color-mix(in srgb,var(--soon) 8%,transparent);box-shadow:inset 3px 0 0 var(--soon)}
.st.live{color:var(--free)} .st.last{color:var(--last)} .st.soon{color:var(--soon)} .st.tbd{color:var(--muted)}
.row.tbd{box-shadow:inset 3px 0 0 var(--dim)}
.narrow .row .nm{font-size:calc(20px*var(--fs))}
.narrow .cond .g{display:none} /* 窄欄只顯示條件，不顯示分類 */
.empty{padding:22px;color:var(--muted);font-size:19px}

/* 圖示 */
.ic{border-radius:8px;background:var(--tile);display:grid;place-items:center;overflow:hidden;flex:none}
.ic img{width:100%;height:100%;object-fit:contain}
.ic .fb{font-size:15px;color:var(--accent)}

/* 聊天室保留區 */
.chat{background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px dashed var(--line)}
.chat .body{flex:1}
html.transparent .chat{background:transparent}
/* 注意：這是直播畫面，不跟隨電腦的「減少動畫」設定（Windows 關閉動畫效果時，跑馬燈與紅點仍要動） */
</style>
</head>

    <div class="clock"><div class="d" id="cDate"></div><div class="flap" id="cTime"></div></div>
  </header>

  <div class="cols">
    <div class="stack narrow">
      <section class="panel" style="--c:var(--soon)">
        <div class="ph"><b>即將開始・即將結束</b><em id="n1"></em></div>
        <div class="scroll" data-col="1"><div class="track"></div></div>
      </section>
      <section class="panel chat" id="chatPanel">
        <div class="ph"><b style="--c:var(--dim)">聊天室</b><span>CHAT</span></div>
        <div class="body"></div>
      </section>
    </div>
    <section class="panel" style="--c:var(--sub)">
      <div class="ph"><b>訂閱／贈訂徽章</b><em id="n2"></em></div>
      <div class="scroll" data-col="2"><div class="track"></div></div>
    </section>
    <section class="panel" style="--c:var(--free)">
      <div class="ph"><b>免費徽章</b><em id="n3"></em></div>
      <div class="scroll" data-col="3"><div class="track"></div></div>
    </section>
  </div>
</div>

<script>
/* 設定優先順序：預設值 < campaigns.manual.json 的 "_overlay" < 網址參數
   網址參數（選用，會蓋過控制台的設定）：
   ?speed1=22&speed2=30&speed3=38  各欄滾動速度（每秒幾 px，0＝不滾動）
   &chat=bottom|top|none            聊天室位置
   &transparent=1                   透明背景
   &viewers=49 / viewers=off        （測試用）觀眾人數
   ?preview=1                       給控制台的即時預覽用，接收 postMessage 設定 */
const DEFAULTS={width:1920,height:1080,cols:[26,37,37],chat:"bottom",speed:[22,30,38],fontScale:1,cmdSize:28,transparent:false,
  colors:{bg:"#0b0f15",panel:"#121822",text:"#f2ead8",accent:"#ffb547",sub:"#b79cff",free:"#5ce0a8",soon:"#79c2ff",last:"#ff6f5e",rec:"#ff3b3b",cmd:"#ffffff"}};
const P=new URLSearchParams(location.search), PREVIEW=P.get("preview")==="1";
const DATA_URL="data/badges.json", MANUAL_URL="data/campaigns.manual.json", DAY=864e5, SOON_WINDOW=14*DAY;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=s=>s?Date.parse(s):null, now=()=>Date.now();

/* ---------- 設定 ---------- */
let CFG=structuredClone(DEFAULTS);
function mergeCfg(base,o){const c=structuredClone(base);if(!o||typeof o!=="object")return c;
  for(const k of Object.keys(DEFAULTS)){if(o[k]==null)continue;if(k==="colors")Object.assign(c.colors,o.colors);else if((k==="speed"||k==="cols")&&Array.isArray(o[k]))c[k]=DEFAULTS[k].map((d,i)=>Number.isFinite(+o[k][i])?+o[k][i]:d);else c[k]=o[k]}
  // 舊設定 leftWidth（左欄 px）換算成百分比
  if(o.leftWidth&&!o.cols){const inner=c.width-60-48,l=Math.round(o.leftWidth/inner*100);c.cols=[l,(100-l)/2,(100-l)/2]}
  return c}
function urlOverrides(c){
  for(const i of [1,2,3]){const v=P.get("speed"+i);if(v!=null&&v!=="")c.speed[i-1]=+v}
  const ch=P.get("chat");if(ch)c.chat=ch==="0"?"none":ch;
  if(P.get("transparent")!=null)c.transparent=P.get("transparent")==="1";
  return c}
function applyCfg(){
  const st=document.getElementById("stage"), r=document.documentElement.style;
  for(const[k,v]of Object.entries(CFG.colors))r.setProperty("--"+k,v);
  r.setProperty("--fs",CFG.fontScale);
  r.setProperty("--cmd-size",(+CFG.cmdSize||28)+"px");
  r.setProperty("--cols",CFG.cols.map(v=>v+"fr").join(" "));
  st.style.width=CFG.width+"px"; st.style.height=CFG.height+"px";
  st.classList.toggle("chat-none",CFG.chat==="none"); st.classList.toggle("chat-top",CFG.chat==="top");
  document.getElementById("chatPanel").hidden=CFG.chat==="none";
  document.documentElement.classList.toggle("transparent",!!CFG.transparent);
  fit(); sig=""; if(DB) refresh(); placeSplits();
}
function fit(){const s=Math.min(innerWidth/CFG.width,innerHeight/CFG.height),st=document.getElementById("stage");st.style.transform=`scale(${s})`;st.style.left=(innerWidth-CFG.width*s)/2+"px";st.style.top=(innerHeight-CFG.height*s)/2+"px"}
addEventListener("resize",()=>{fit();sig="";if(DB)refresh()});

/* ---------- 翻牌字卡：只有改變的字會翻動 ---------- */
function flap(el,parts){
  const want=[];for(const p of parts){if(p.u)want.push(["u",p.u]);else if(p.s)want.push(["sep",p.s]);else for(const ch of p.t)want.push(["d",ch])}
  const kids=el.children;
  if(kids.length!==want.length||[...kids].some((k,i)=>k.dataset.k!==want[i][0])){
    el.innerHTML=want.map(([k,v])=>`<i class="${k==="d"?"":k}" data-k="${k}">${esc(v)}</i>`).join("");return;
  }
  want.forEach(([k,v],i)=>{const n=kids[i];if(n.textContent!==v){n.textContent=v;if(k==="d"){n.classList.remove("flip");void n.offsetWidth;n.classList.add("flip")}}});
}
const p2=n=>String(n).padStart(2,"0");
function cdParts(ms){
  if(ms<0) ms=0;
  const d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);
  return d?[{t:String(d)},{u:"天"},{t:p2(h)},{s:":"},{t:p2(m)},{s:":"},{t:p2(s)}]:[{t:p2(h)},{s:":"},{t:p2(m)},{s:":"},{t:p2(s)}];
}

/* ---------- 時鐘 ---------- */
const fD=new Intl.DateTimeFormat("zh-TW",{month:"long",day:"numeric",weekday:"long"});
const tz=new Intl.DateTimeFormat("zh-TW",{timeZoneName:"short"}).formatToParts(new Date()).find(p=>p.type==="timeZoneName")?.value||"";
function clock(){const d=new Date();document.getElementById("cDate").innerHTML=`<b>${esc(fD.format(d))}</b>${esc(tz)}`;flap(document.getElementById("cTime"),[{t:p2(d.getHours())},{s:":"},{t:p2(d.getMinutes())},{s:":"},{t:p2(d.getSeconds())}])}

/* ---------- 直播狀態、觀眾數、頭貼（每分鐘向 Worker 的 /channel 讀一次） ----------
   網址參數 ?viewers=49 或 viewers=off 可以手動指定（測試用），指定時就不向 Worker 讀 */
const CHANNEL_API=P.get("api")||"https://badge-notifier.lwldoge.workers.dev/channel";
function setViewers(n){const v=document.getElementById("viewers"),off=n==null||n==="off";
  v.classList.toggle("off",off); document.querySelector(".me").classList.toggle("off",off);
  document.getElementById("vc").textContent=off?"離線":Number(n).toLocaleString("en-US")}
async function loadChannel(){
  try{
    const r=await fetch(CHANNEL_API+"?t="+Date.now(),{cache:"no-store"}), j=await r.json();
    if(!j.ok) return; // 讀不到時維持上一次的狀態
    setViewers(j.live?j.viewers:null);
    const a=document.getElementById("avatar");
    if(j.avatar&&a.dataset.src!==j.avatar){const img=new Image();img.onload=()=>{a.src=j.avatar;a.dataset.src=j.avatar};img.src=j.avatar}
  }catch(_){}
}
if(P.get("viewers")!=null) setViewers(P.get("viewers"));
else { setViewers(null); loadChannel(); setInterval(loadChannel,60*1000); }

/* ---------- 徽章類型 ----------
   控制台有設定 type 就用設定；留空時自動判斷（與控制台的 autoType 保持一致）
   sub＝訂閱／贈訂欄，free＝免費欄，other＝兩欄都不放（例如買票才有的徽章） */
function autoType(b){const c=b.campaign||{},d=b.description||"";
  if(c.subs)return "sub"; if(c.minutes)return "free";
  if(/subscrib|gift|subbed/i.test(d))return "sub";
  if(/purchas|ticket/i.test(d))return "other";
  return "free"}
let MANUAL={};
const keyOf=b=>b.set_id+"/"+b.id;
const typeOf=b=>MANUAL[keyOf(b)]?.type||autoType(b);
/* 控制台手動指定的位置：left＝左欄、sub＝訂閱欄、free＝免費欄、hide＝不顯示；沒有＝依時間與類型自動 */
const columnOf=b=>MANUAL[keyOf(b)]?.column||"";

const cond=b=>{const c=b.campaign||{},g=c.game&&c.game!=="任意分類"?`<span class="g">${esc(c.game)}</span>`:"",r=c.subs?`訂閱 <em>${c.subs}</em> 次`:c.minutes?`觀看 <em>${c.minutes}</em> 分鐘`:"";return r&&g?`${r}<span class="g">　・　</span>${g}`:r||g};
const initials=s=>String(s).replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const icon=b=>`<span class="ic"><img src="${esc(b.image_url_2x||b.image_url_4x||"")}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${initials(b.title)}'}))"></span>`;
const KIND_ZH={live:"可解鎖",last:"即將結束",soon:"即將開始",tbd:"時間未公布"};
const mq=(cls,html)=>`<span class="mq ${cls}"><span>${html}</span></span>`;
function rowHTML(b,k){
  const c=b.campaign||{}, m=MANUAL[keyOf(b)]||{}, target=k==="soon"?c.start:c.end;
  const cd=k==="tbd"?"":`<span class="flap" data-t="${esc(target||"")}"></span>`;
  const cmd=m.cmd?mq("cmd",esc(m.cmd)):"";                       // 控制台勾選的指令欄（右上角）
  const note=String(m.note??c.note??"").replace(/\s*\n\s*/g,"　").trim(); // 備註：換行改成空白，排成一行
  const cd2=cond(b);
  return `<div class="row ${k==="live"?"":k}">${icon(b)}<div class="bd">
    <div class="top">${mq("nm",esc(b.title))}${cmd}</div>
    <div class="meta"><span class="st ${k}">${KIND_ZH[k]}</span>${cd}${cd2?mq("cond",cd2):""}</div>
    ${note?mq("note",esc(note)):""}</div></div>`;
}
/* 量每一段文字：超出寬度的才加上跑馬燈。速度約每秒 45px，前後各停一下 */
function marquee(root){
  root.querySelectorAll(".mq").forEach(el=>{
    const over=el.firstElementChild.scrollWidth-el.clientWidth;
    if(over>2){
      const d=-(over+20)+"px", t=Math.max(4,(over+20)/45/0.76).toFixed(1)+"s";
      // 只有數值改變才重設，避免正在跑的跑馬燈跳回開頭
      if(el.style.getPropertyValue("--d")!==d) el.style.setProperty("--d",d);
      if(el.style.getPropertyValue("--t")!==t) el.style.setProperty("--t",t);
      el.classList.add("run");
    }else el.classList.remove("run");
  });
}
// 每 5 秒重新量一次（字型、圖片晚載入或畫面縮放後，寬度可能改變）
setInterval(()=>marquee(document.querySelector(".cols")),5000);

/* ---------- 資料 ---------- */
let DB=null, sig="";
async function load(){
  if(window.__OVERLAY_DEMO__){ // 單檔測試版：資料直接寫在檔案裡
    DB=window.__OVERLAY_DEMO__.badges; MANUAL=window.__OVERLAY_DEMO__.manual||{};
  }else{
    try{
      const q="?t="+Date.now(), [a,m]=await Promise.all([fetch(DATA_URL+q,{cache:"no-store"}),fetch(MANUAL_URL+q,{cache:"no-store"}).catch(()=>null)]);
      if(a.ok) DB=await a.json();
      if(m&&m.ok) MANUAL=await m.json();
    }catch(_){}
  }
  if(!PREVIEW) CFG=urlOverrides(mergeCfg(DEFAULTS,MANUAL._overlay));
  applyCfg();
}
/* 狀態：soon 還沒開始｜last 剩不到 24 小時｜live 可解鎖｜tbd 沒有開始時間｜ended 已結束 */
function kindOf(b,n){const c=b.campaign||{},s=t(c.start),e=t(c.end);
  if(!s)return "tbd"; if(n<s)return "soon"; if(e&&n>=e)return "ended"; return e&&e-n<DAY?"last":"live"}
function refresh(){
  const n=now(), L=[], SUB=[], FREE=[];
  for(const b of DB?.badges||[]){
    if(b.removed_at)continue;
    const k=kindOf(b,n), col=columnOf(b);
    if(k==="ended"||col==="hide")continue;
    if(col){ // 手動指定位置：不看時間，直接放進指定的欄（時間未公布也會顯示）
      (col==="left"?L:col==="sub"?SUB:col==="free"?FREE:[]).push([b,k]); continue }
    if(k==="tbd")continue;
    if(k==="soon"){if(t(b.campaign.start)-n<SOON_WINDOW)L.push([b,k]);continue}
    if(k==="last")L.push([b,k]);
    const ty=typeOf(b); if(ty==="sub")SUB.push([b,k]); else if(ty==="free")FREE.push([b,k])}
  // 排序：即將結束 → 可解鎖（依結束時間）→ 即將開始（依開始時間）→ 時間未公布
  const ORDER={last:0,live:1,soon:2,tbd:3};
  const at=([b,k])=>k==="soon"?t(b.campaign.start):(t(b.campaign?.end)??Infinity);
  const sorter=(x,y)=>ORDER[x[1]]-ORDER[y[1]]||at(x)-at(y)||x[0].title.localeCompare(y[0].title);
  [L,SUB,FREE].forEach(A=>A.sort(sorter));
  const s=JSON.stringify([L,SUB,FREE].map(A=>A.map(([b,k])=>{const c=b.campaign||{},m=MANUAL[keyOf(b)]||{};return keyOf(b)+c.start+c.end+c.subs+c.minutes+c.game+(m.note??c.note)+m.cmd+k})));
  if(s===sig) return; sig=s;
  document.getElementById("n1").textContent=L.length||"";
  document.getElementById("n2").textContent=SUB.length||"";
  document.getElementById("n3").textContent=FREE.length||"";
  fill(1,L.map(([b,k])=>rowHTML(b,k)),"目前沒有即將開始或即將結束的活動");
  fill(2,SUB.map(([b,k])=>rowHTML(b,k)),"目前沒有可解鎖的訂閱徽章");
  fill(3,FREE.map(([b,k])=>rowHTML(b,k)),"目前沒有可解鎖的免費徽章");
  tick(); marquee(document.querySelector(".cols"));
}

/* ---------- 捲動 ---------- */
const COLS={};
function fill(col,rows,emptyText){
  const box=document.querySelector(`.scroll[data-col="${col}"]`), tr=box.querySelector(".track");
  const one=rows.length?`<div class="list">${rows.join("")}</div>`:`<div class="empty">${emptyText}</div>`;
  tr.innerHTML=one;
  const h=tr.firstElementChild.offsetHeight, loop=rows.length&&h>box.clientHeight&&CFG.speed[col-1]>0;
  if(loop) tr.innerHTML=one+one; // 第二份接在後面，捲完第一份就跳回 0，看起來無縫
  const prev=COLS[col];
  COLS[col]={tr,h,loop,y:loop&&prev?prev.y%h:0};
  if(!loop) tr.style.transform="";
}
let last=0;
function frame(ts){
  const dt=last?Math.min(0.1,(ts-last)/1000):0; last=ts;
  for(const [col,c] of Object.entries(COLS)){ if(!c.loop) continue;
    c.y=(c.y+CFG.speed[col-1]*dt)%c.h; c.tr.style.transform=`translateY(${-c.y}px)` }
  requestAnimationFrame(frame);
}
function tick(){const n=now();document.querySelectorAll(".row .flap[data-t]").forEach(el=>{const x=t(el.dataset.t);if(x)flap(el,cdParts(x-n));else el.textContent="未公布"})}

/* ---------- 欄寬拖曳條（只在控制台預覽出現，拖完把新寬度傳回控制台） ---------- */
const colsEl=document.querySelector(".cols"), SPLITS=[];
const GAP=24, MIN_PCT=12;
function placeSplits(){if(!SPLITS.length)return;const k=[...colsEl.children].filter(x=>!x.classList.contains("split"));
  SPLITS.forEach((sp,i)=>{sp.style.left=(k[i].offsetLeft+k[i].offsetWidth+GAP/2)+"px"})}
if(PREVIEW){
  for(let i=0;i<2;i++){const sp=document.createElement("div");sp.className="split";sp.title="拖曳調整欄寬";sp.innerHTML="<i><b></b><b></b><b></b></i>";colsEl.appendChild(sp);SPLITS.push(sp);
    sp.addEventListener("pointerdown",e=>{
      e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add("drag");
      const r=colsEl.getBoundingClientRect(), scale=r.width/colsEl.offsetWidth, W=colsEl.clientWidth-2*GAP;
      const tot=CFG.cols.reduce((a,b)=>a+b,0), pct=CFG.cols.map(v=>v/tot*100);
      const move=ev=>{
        const x=(ev.clientX-r.left)/scale, before=pct.slice(0,i).reduce((a,b)=>a+b,0), pair=pct[i]+pct[i+1];
        // 滑鼠位置換算成左邊那一欄的寬度（扣掉前面的欄與間隙）
        let a=((x-i*GAP-GAP/2)/W*100)-before;
        a=Math.min(pair-MIN_PCT,Math.max(MIN_PCT,a));
        const next=pct.slice(); next[i]=Math.round(a*10)/10; next[i+1]=Math.round((pair-a)*10)/10;
        CFG.cols=next; document.documentElement.style.setProperty("--cols",next.map(v=>v+"fr").join(" ")); placeSplits();
      };
      const up=()=>{sp.classList.remove("drag");sp.removeEventListener("pointermove",move);sp.removeEventListener("pointerup",up);sp.removeEventListener("pointercancel",up);
        sig="";if(DB)refresh(); parent.postMessage({type:"overlay-cols",cols:CFG.cols},"*")};
      sp.addEventListener("pointermove",move);sp.addEventListener("pointerup",up);sp.addEventListener("pointercancel",up);
    });
  }
  addEventListener("resize",placeSplits); document.fonts?.ready.then(placeSplits);
}

/* ---------- 控制台即時預覽 ---------- */
if(PREVIEW) addEventListener("message",e=>{const d=e.data;if(!d||typeof d!=="object")return;
  if(d.type==="overlay-config"){CFG=mergeCfg(DEFAULTS,d.config);applyCfg()}
  if(d.type==="overlay-manual"){MANUAL=d.manual||{};sig="";if(DB)refresh()}});

clock(); applyCfg(); load();
setInterval(()=>{clock();tick()},1000);
setInterval(()=>{if(DB)refresh()},15*1000);
if(!window.__OVERLAY_DEMO__&&!PREVIEW) setInterval(load,60*1000);
document.fonts?.ready.then(()=>{sig="";if(DB)refresh()});
requestAnimationFrame(frame);
if(PREVIEW) parent.postMessage({type:"overlay-ready"},"*");
</script>
</body>
</html>
