name: 更新徽章資料

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分鐘（GitHub 尖峰時段可能延遲）
  workflow_dispatch:          # 可在 Actions 頁面手動執行
  push:
    branches: [main]
    paths-ignore: ["data/badges.json"]

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: read   # 改動：讀取 github-pages 的部署紀錄，用來找出卡住的部署

concurrency:
  group: update-badges
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 改動：一律從最新的 main 開始（排隊中的工作原本會拿觸發當下的舊版本，跟前一次更新的 badges.json 衝突）

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 從 Twitch 抓取徽章
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_USER_TOKEN: ${{ secrets.TWITCH_USER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/update.mjs

      - name: 有變化就存檔
        id: commit
        run: |
          git config user.name "badge-bot"
          git config user.email "badge-bot@users.noreply.github.com"
          git add data/badges.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "更新徽章資料 $(date -u +%Y-%m-%dT%H:%MZ)"
            # 改動：執行期間如果有人上傳檔案或控制台存檔，先把新的 commit 接上再推，最多試 3 次
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              # 改動：badges.json 是自動產生的，衝突時不手動合併：放棄這次的版本，回到最新的 main 重新產生一次再推
              echo "推送失敗，改用最新版本重新產生（第 $i 次）"
              git rebase --abort 2>/dev/null || true
              git fetch origin main && git reset --hard origin/main
              DISCORD_WEBHOOK_URL="" node scripts/update.mjs   # 重新產生時不重複發 Discord 通知
              git add data/badges.json
              if git diff --cached --quiet; then echo "最新版本已經是一樣的內容，不用再推"; pushed=1; break; fi
              git commit -m "更新徽章資料 $(date -u +%Y-%m-%dT%H:%MZ)"
              sleep 3
            done
            [ "$pushed" = 1 ] || { echo "重試 3 次仍然失敗"; exit 1; }
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 準備網站檔案
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p _site/data
          cp *.html _site/
          cp data/badges.json data/campaigns.manual.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site

      - id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        continue-on-error: true   # 改動：失敗時先處理卡住的部署，再試一次
        uses: actions/deploy-pages@v4

      # 改動：GitHub Pages 有時會留下一個一直「進行中」的舊部署，之後的部署都會被擋下
      #（Deployment request failed ... due to in progress deployment）。這時把其他還沒結束的部署取消，再部署一次。
      - name: 部署被卡住時，取消卡住的部署
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ME: ${{ github.sha }}
        run: |
          for sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$ME" ] && continue
            if gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" >/dev/null 2>&1; then echo "已取消卡住的部署 $sha"; fi
          done
          sleep 10

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
